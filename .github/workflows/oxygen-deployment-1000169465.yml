name: Storefront 1000169465
on: [push]

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy to Oxygen
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          check-latest: true

      - name: Cache node modules
        id: cache-npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Detect Hydrogen project
        id: hydrogen
        run: |
          if grep -q '"@shopify/hydrogen"' package.json 2>/dev/null; then
            echo "is_hydrogen=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_hydrogen=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and Publish to Oxygen
        if: steps.hydrogen.outputs.is_hydrogen == 'true'
        run: npx shopify hydrogen deploy
        env:
          SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN: ${{ secrets.OXYGEN_DEPLOYMENT_TOKEN_1000169465 }}

      - name: Skip deploy when Hydrogen project is missing
        if: steps.hydrogen.outputs.is_hydrogen != 'true'
        run: echo "Skipping Oxygen deploy because this repository is not a Hydrogen project."
